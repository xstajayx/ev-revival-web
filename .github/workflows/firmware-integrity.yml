name: Approved firmware integrity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node .github/firmware/check.mjs
        env:
          FIRMWARE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: node .github/firmware/integrity.test.mjs
      - run: sh .github/firmware/build.sh
      - run: git diff --exit-code -- ev-revival-local/vendor/esp-web-tools.js
